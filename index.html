<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUMeS - TopUp Mini App</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1f2937;
            --banner-bg: #e2e8f0;
            --msg-bg: #9333ea;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --modal-bg: #ffffff;
            --input-bg: #f3f4f6;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --banner-bg: #334155;
            --msg-bg: #7e22ce;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            --modal-bg: #0f172a;
            --input-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* App Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            box-shadow: var(--shadow);
        }

        @media (min-width: 480px) {
            .app-container {
                min-height: 800px;
                border-radius: 25px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: transparent;
        }

        .app-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-color);
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(150, 150, 150, 0.15);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Main Content */
        .content {
            padding: 0 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
        }

        /* Text Message Bar */
        .text-message {
            background-color: var(--msg-bg);
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Banner */
        .banner {
            background-color: var(--banner-bg);
            color: var(--text-color);
            text-align: center;
            padding: 30px 10px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
        }

        /* Grid Cards */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: rgba(150, 150, 150, 0.05);
            border-radius: 16px;
            padding: 24px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            border: 1px solid rgba(150, 150, 150, 0.15);
        }

        .card:active {
            opacity: 0.8;
        }

        .roblox-icon {
            width: 48px;
            height: 48px;
            background: #000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
            text-align: center;
        }

        .empty-card {
            border: 2px dashed rgba(150, 150, 150, 0.3);
            min-height: 130px;
            background: transparent;
        }

        /* Modal Popup Styles */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--modal-bg);
            width: 90%;
            max-width: 360px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--text-color);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group input {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(150,150,150,0.3);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }

        /* Robux Price List */
        .robux-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .robux-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(150,150,150,0.2);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .robux-item:hover {
            border-color: #3b82f6;
        }

        .robux-info {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .robux-price {
            background: #3b82f6;
            color: #fff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .telegram-contact {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 5px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            width: 100%;
        }

        .telegram-contact:hover {
            text-decoration: underline;
        }

        /* Tab Switcher for Menu Auth */
        .tab-buttons {
            display: flex;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 4px;
            gap: 5px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 8px;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: #fff;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .submit-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body data-theme="dark">

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="app-title">YUMeS - TopUp</div>
            <div class="header-icons">
                <button class="icon-btn" id="themeToggle" title="ប្ដូរ Light/Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="icon-btn" id="menuToggle" title="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- Body Content -->
        <div class="content">
            <div class="text-message">សូមស្វាគមន៍មកកាន់ YUMeS - TopUP 24/7</div>
            <div class="banner">Banner</div>

            <!-- Grid options -->
            <div class="grid-menu">
                <div class="card empty-card" onclick="alert('មុខងារនឹងរៀបចំពេលក្រោយ!')"></div>
                <div class="card empty-card" onclick="alert('មុខងារនឹងរៀបចំពេលក្រោយ!')"></div>
                <div class="card empty-card" onclick="alert('មុខងារនឹងរៀបចំពេលក្រោយ!')"></div>
                
                <!-- Roblox Topup Card (ដាក់នៅខាងក្រោមគេ) -->
                <div class="card" id="robloxCardBtn">
                    <div class="roblox-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M9 9l6 6"></path><path d="M15 9l-6 6"></path></svg>
                    </div>
                    <div class="card-title">Roblox Topup</div>
                </div>
            </div>
        </div>

        <!-- Modal Popup សម្រាប់ Roblox Topup -->
        <div class="modal-overlay" id="robuxModal">
            <div class="modal-content">
                <div class="modal-header">
                    <span>តារាងតម្លៃ Roblox Topup</span>
                    <button class="close-modal" id="closeRobuxModal">&times;</button>
                </div>

                <!-- ប្រអប់បញ្ចូល Telegram Username -->
                <div class="form-group">
                    <label>Telegram Username របស់អ្នក (ឧ. @username)</label>
                    <input type="text" id="tgUsernameInput" placeholder="បញ្ចូល Telegram Username">
                </div>

                <div style="font-size: 0.85rem; font-weight: 600; margin-top: 5px;">ជ្រើសរើសកញ្ចប់ Robux៖</div>

                <!-- តារាងតម្លៃ Robux -->
                <div class="robux-list">
                    <div class="robux-item" onclick="buyRobux('80 Robux', '1$')">
                        <div class="robux-info">💎 80 Robux</div>
                        <div class="robux-price">1$</div>
                    </div>
                    <div class="robux-item" onclick="buyRobux('160 Robux', '2$')">
                        <div class="robux-info">💎 160 Robux</div>
                        <div class="robux-price">2$</div>
                    </div>
                </div>

                <a href="https://t.me/longzzsmmdigitall" target="_blank" class="telegram-contact">
                    <i class="fa-brands fa-telegram"></i> ទាក់ទងអេតមីន: @longzzsmmdigitall
                </a>
            </div>
        </div>

        <!-- Modal Popup សម្រាប់ Menu (Auth) -->
        <div class="modal-overlay" id="authModal">
            <div class="modal-content">
                <div class="modal-header">
                    <span id="modalTitle">ចូលគណនី</span>
                    <button class="close-modal" id="closeAuthModal">&times;</button>
                </div>
                <div class="tab-buttons">
                    <button class="tab-btn active" id="loginTabBtn">ចូលគណនី</button>
                    <button class="tab-btn" id="signupTabBtn">បង្កើតគណនី</button>
                </div>
                <form class="form-container" id="loginForm" onsubmit="event.preventDefault(); alert('ចូលគណនីជោគជ័យ!');">
                    <div class="form-group">
                        <label>ឈ្មោះអ្នកប្រើប្រាស់</label>
                        <input type="text" placeholder="បញ្ចូលឈ្មោះ" required>
                    </div>
                    <div class="form-group">
                        <label>ពាក្យសម្ងាត់</label>
                        <input type="password" placeholder="ពាក្យសម្ងាត់" required>
                    </div>
                    <button type="submit" class="submit-btn">ចូលគណនី</button>
                </form>
                <form class="form-container hidden" id="signupForm" onsubmit="event.preventDefault(); alert('បង្កើតគណនីជោគជ័យ!');">
                    <div class="form-group">
                        <label>ឈ្មោះអ្នកប្រើប្រាស់</label>
                        <input type="text" placeholder="បង្កើតឈ្មោះ" required>
                    </div>
                    <div class="form-group">
                        <label>ពាក្យសម្ងាត់</label>
                        <input type="password" placeholder="បង្កើតពាក្យសម្ងាត់" required>
                    </div>
                    <button type="submit" class="submit-btn">បង្កើតគណនី</button>
                </form>
                <a href="https://t.me/longzzsmmdigitall" target="_blank" class="telegram-contact">
                    <i class="fa-brands fa-telegram"></i> @longzzsmmdigitall
                </a>
            </div>
        </div>
    </div>

    <script>
        // Dark / Light Mode Toggle
        const themeToggleBtn = document.getElementById('themeToggle');
        const bodyElement = document.body;
        const iconElement = themeToggleBtn.querySelector('i');

        themeToggleBtn.addEventListener('click', () => {
            if (bodyElement.getAttribute('data-theme') === 'dark') {
                bodyElement.setAttribute('data-theme', 'light');
                iconElement.classList.replace('fa-moon', 'fa-sun');
            } else {
                bodyElement.setAttribute('data-theme', 'dark');
                iconElement.classList.replace('fa-sun', 'fa-moon');
            }
        });

        // Roblox Topup Modal Script
        const robloxCardBtn = document.getElementById('robloxCardBtn');
        const robuxModal = document.getElementById('robuxModal');
        const closeRobuxModal = document.getElementById('closeRobuxModal');

        robloxCardBtn.addEventListener('click', () => {
            robuxModal.classList.add('active');
        });

        closeRobuxModal.addEventListener('click', () => {
            robuxModal.classList.remove('active');
        });

        // Function បញ្ជូនទិន្ន័យទៅ Telegram
        function buyRobux(packageType, price) {
            const tgUser = document.getElementById('tgUsernameInput').value.trim();
            if(!tgUser) {
                alert('សូមបញ្ចូល Telegram Username របស់អ្នកជាមុនសិន!');
                document.getElementById('tgUsernameInput').focus();
                return;
            }
            const message = `សួស្តី Admin, ខ្ញុំចង់ទិញ ${packageType} (${price}) | Telegram Username: ${tgUser}`;
            const url = `https://t.me/longzzsmmdigitall?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        // Menu Auth Modal Script
        const menuToggle = document.getElementById('menuToggle');
        const authModal = document.getElementById('authModal');
        const closeAuthModal = document.getElementById('closeAuthModal');

        menuToggle.addEventListener('click', () => {
            authModal.classList.add('active');
        });

        closeAuthModal.addEventListener('click', () => {
            authModal.classList.remove('active');
        });

        // Tabs
        const loginTabBtn = document.getElementById('loginTabBtn');
        const signupTabBtn = document.getElementById('signupTabBtn');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const modalTitle = document.getElementById('modalTitle');

        loginTabBtn.addEventListener('click', () => {
            loginTabBtn.classList.add('active');
            signupTabBtn.classList.remove('active');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            modalTitle.innerText = "ចូលគណនី";
        });

        signupTabBtn.addEventListener('click', () => {
            signupTabBtn.classList.add('active');
            loginTabBtn.classList.remove('active');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            modalTitle.innerText = "បង្កើតគណនី";
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === robuxModal) robuxModal.classList.remove('active');
            if (e.target === authModal) authModal.classList.remove('active');
        });
    </script>
</body>
</html>
